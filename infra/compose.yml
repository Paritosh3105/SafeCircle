services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: safecircle
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: safecircle
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safecircle"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  database:
